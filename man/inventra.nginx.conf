# Reference copy of the LIVE server file /etc/nginx/conf.d/inventra.conf on
# 192.168.0.91 — NOT deployed from this repo. This is the port-80
# default_server, shared across multiple unrelated apps on this host
# (Inventra Admin Dashboard, Storefront, Marketing Site, AND Musterly) — it
# does not belong to any single app's repo, but is committed here for the
# same reason as man/musterly.nginx.conf: TEC-45/TEC-50 discovered this file
# has its own hardcoded Musterly path/redirect rules that silently drifted
# out of sync with the actual app when the URL was renamed, because nothing
# tracked it anywhere. Only the "Musterly" location block below is owned by
# this repo — the rest (Inventra/Storefront/Marketing routes) is informational
# context so the Musterly block's placement and precedence make sense; edit
# those in Inventra's own repo/ops docs, not here.
#
# To update the live file: SSH in, back up the current file
# (cp inventra.conf inventra.conf.bak-$(date +%Y%m%d-%H%M%S)), copy this
# file's Musterly block into it, `sudo nginx -t`, then
# `sudo systemctl reload nginx`.
#
# Deployment history: originally proxied /musterly directly to the app with
# no redirect. TEC-50 renamed the app's canonical path to /mustearly; this
# file was missed during that rename (it lives only on the server, was never
# tracked anywhere) and kept sending /musterly straight to the app, which
# then 404'd since its basePath no longer matched — this looked like the app
# had crashed. Fixed by adding a 301/redirect for the old path and updating
# the proxy target to /mustearly, mirroring man/musterly.nginx.conf's pattern.
# Fixed 2026-08-06.

# Admin Dashboard — served on port 80 (default)
server {
    listen 80 default_server;
    server_name _;

    # Marketing Site routes — proxied to port 3003
    location /signup {
        proxy_pass http://127.0.0.1:3003/inventra/marketing/signup;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /pricing {
        proxy_pass http://127.0.0.1:3003/inventra/marketing/pricing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /features {
        proxy_pass http://127.0.0.1:3003/inventra/marketing/features;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /blog {
        proxy_pass http://127.0.0.1:3003/inventra/marketing/blog;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API accessible via /api path
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Bare root — redirect to Admin Dashboard basePath (no trailing slash;
    # the app itself owns the redirect from /inventra to /inventra/login
    # or /inventra/dashboard). Using the exact-match location below avoids
    # nginx's automatic trailing-slash redirect looping against the app's
    # own /inventra/ -> /inventra redirect.
    location = / {
        return 301 /inventra;
    }

    # Exact match for bare /inventra (no trailing slash) — proxied directly
    # so it does not fall through to the prefix location below and trigger
    # nginx's automatic slash-append redirect (which loops with the app's
    # own redirect from /inventra/ back to /inventra).
    location = /inventra {
        proxy_pass http://127.0.0.1:3001/inventra;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Marketing Site assets/pages under /inventra/marketing basePath — must be
    # matched before the generic /inventra/ prefix below, otherwise marketing
    # site JS/CSS (_next assets) get misrouted to the Admin Dashboard (3001)
    # and break /signup, /pricing, /features, /blog pages.
    location = /inventra/marketing {
        proxy_pass http://127.0.0.1:3003/inventra/marketing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /inventra/marketing/ {
        proxy_pass http://127.0.0.1:3003/inventra/marketing/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin Dashboard — served under /inventra basePath
    location /inventra/ {
        proxy_pass http://127.0.0.1:3001/inventra/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Musterly (this repo) ──────────────────────────────────────────────
    # Backward-compat: old canonical path (pre-TEC-50), redirect to /mustearly.
    location = /musterly {
        return 301 /mustearly;
    }
    location /musterly/ {
        rewrite ^/musterly/(.*)$ /mustearly/$1 permanent;
    }

    location = /mustearly {
        proxy_pass http://127.0.0.1:3000/mustearly;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25m;
    }

    location /mustearly/ {
        proxy_pass http://127.0.0.1:3000/mustearly/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25m;
    }
}
# NOTE: Storefront (port 3002) is served directly by PM2/Next.js on port 50006.
# NOTE: Marketing Site (port 3003) routes are proxied above through port 80/50004.
