# Reference copy of the LIVE server file /etc/nginx/conf.d/gateway.conf on
# 192.168.0.91 — NOT deployed from this repo. Listens on port 50007, shared
# across Inventra and Musterly. Confirmed 2026-08-06 that the router's actual
# external port-forward for :50007 goes DIRECTLY to this app's port 3000,
# bypassing this nginx block entirely — so this file is currently not on the
# externally-reachable path for Musterly traffic. Still fixed and committed
# here for consistency (it did have the same stale /musterly reference as
# man/inventra.nginx.conf) in case that routing ever changes, or this block
# starts receiving real traffic. Only the "Musterly" location block below is
# owned by this repo — see man/inventra.nginx.conf for full context on the
# TEC-50 rename drift this was part of.
#
# To update the live file: SSH in, back up the current file
# (cp gateway.conf gateway.conf.bak-$(date +%Y%m%d-%H%M%S)), copy this file's
# Musterly block into it, `sudo nginx -t`, then `sudo systemctl reload nginx`.
#
# Fixed 2026-08-06.

server {
    listen 50007;

    location /inventra/ {
        proxy_pass http://127.0.0.1:3001/inventra/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /inventra/store/ {
        proxy_pass http://127.0.0.1:3002/inventra/store/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /inventra/store {
        proxy_pass http://127.0.0.1:3002/inventra/store;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /inventra/marketing {
        proxy_pass http://127.0.0.1:3003/inventra/marketing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /inventra/marketing/ {
        proxy_pass http://127.0.0.1:3003/inventra/marketing/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Musterly (this repo) ──────────────────────────────────────────────
    # Backward-compat: old canonical path (pre-TEC-50), redirect to /mustearly.
    location = /musterly {
        return 301 /mustearly;
    }
    location /musterly/ {
        rewrite ^/musterly/(.*)$ /mustearly/$1 permanent;
    }

    location = /mustearly {
        proxy_pass http://127.0.0.1:3000/mustearly;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25m;
    }

    location /mustearly/ {
        proxy_pass http://127.0.0.1:3000/mustearly/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25m;
    }
}
