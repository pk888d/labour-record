# Musterly (LabourRecord) — nginx reverse proxy.
# Deploy on the server as:  /etc/nginx/conf.d/musterly.conf
#   sudo cp man/musterly.nginx.conf /etc/nginx/conf.d/musterly.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Mirrors inventra.conf style: plain HTTP by IP, no domain, no SSL.
# Port 80 is taken by inventra (listen 80 default_server); 8080 is free and
# already open in firewalld. Requires SELinux httpd_can_network_connect=on
# (already enabled on this host, since inventra also proxies to local ports).
#
# Path-prefixed under /mustearly (TEC-50: canonical spelling, matches the
# app's own UI branding — was /musterly through TEC-45/TEC-49) — must match
# next.config.ts's NEXT_PUBLIC_BASE_PATH exactly. proxy_pass preserves the
# /mustearly prefix (no trailing-slash-on-source-only rewrite) so it lines up
# with Next's basePath, which strips /mustearly internally before routing.
# The app's own fetch() calls carry the prefix via src/lib/api-path.ts's
# apiPath() helper — there is deliberately no separate /api location block;
# /mustearly/ already catches /mustearly/api/... once the frontend sends it
# correctly. The old /musterly path 301-redirects here for existing bookmarks.
server {
    listen 8080;
    server_name _;

    # Allow large form/print payloads
    client_max_body_size 25m;

    location = / {
        return 301 /mustearly;
    }

    # Backward-compat: old canonical path (pre-TEC-50), preserve the rest of
    # the URL (query string included) for any bookmarked deep links.
    location = /musterly {
        return 301 /mustearly;
    }
    location /musterly/ {
        rewrite ^/musterly/(.*)$ /mustearly/$1 permanent;
    }

    location = /mustearly {
        proxy_pass http://127.0.0.1:3000/mustearly;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /mustearly/ {
        proxy_pass http://127.0.0.1:3000/mustearly/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
