name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labour-record-app
    env:
      # CI uses a throwaway local SQLite file; prisma.config.ts reads DATABASE_URL.
      DATABASE_URL: "file:./ci.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: labour-record-app/package-lock.json

      # npm ci runs the postinstall `prisma generate` automatically.
      - run: npm ci

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # Failure notifications: run `/github subscribe pk888d/labour-record workflows` in #mustearly.
  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labour-record-app
    env:
      # CI uses a throwaway local SQLite file; prisma.config.ts reads DATABASE_URL.
      DATABASE_URL: "file:./ci.db"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: labour-record-app/package-lock.json

      # npm ci runs the postinstall `prisma generate` automatically.
      - run: npm ci

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Seed the CI database
        run: npx tsx prisma/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: labour-record-app/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: labour-record-app/test-results/
          retention-days: 7
